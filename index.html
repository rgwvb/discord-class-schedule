<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>青蛙課表</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="controls">
    <div id="dayTabs" class="tabs"></div>
    <p id="updated" class="updated"></p>
  </div>

  <main id="poster" class="poster">
    <header class="poster-head">
      <div class="scribble left">Better<br>Learning<br>A Brighter Tomorrow</div>
      <div class="headline">
        <div class="books" aria-hidden="true">📚</div>
        <div>
          <h1 id="posterTitle">今日課表｜週一</h1>
          <p id="posterDate" class="poster-date"></p>
        </div>
      </div>
      <div class="scribble right">Class<br>Schedule! ♡</div>
      <img class="frog" src="assets/frog.svg" alt="青蛙吉祥物" />
      <div id="posterNotice" class="notice">當日課表不完全相同，以下依相同課表分組顯示</div>
    </header>

    <section id="schedule" class="schedule" aria-live="polite"></section>

    <footer class="poster-foot">
      <span>— 學習，讓明天更美好 —</span>
      <span class="keep">Keep Going! :)</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
